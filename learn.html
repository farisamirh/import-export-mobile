    <h2>📖 What are Import & Export?</h2>
    <p><b>Import:</b> Buying goods/services from other countries into Malaysia.</p>
    <p><b>Export:</b> Selling Malaysian goods/services to other countries.</p>
    <p>💡 Imports cost money (reduce balance). Exports bring income (increase balance).</p>
